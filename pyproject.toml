[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "BLE001",  # Blind except Exception — intentional for graceful degradation
    "DTZ003",  # naive utcnow — converted to aware where possible
    "S110",    # try-except-pass — intentional graceful degradation
]
